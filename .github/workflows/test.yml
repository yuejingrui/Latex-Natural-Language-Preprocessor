name: tests
on: [push, pull_request]

jobs:
  # The chain needs nothing but Python: every probe and unit test runs here, and
  # the cases that need a TeX engine skip themselves and say so.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: probes and unit tests
        run: python tests/run_all.py
      - name: pipeline layer, offline
        run: python -m unittest pipeline.tests.test_pipeline -v

  # --tex-engine is the one path the job above cannot reach.  This job installs a
  # TeX engine and pdftotext so those cases run too; it is allowed to fail, and a
  # failed install only means they skip again.
  tex-engine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install a TeX engine and pdftotext
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          # latex-extra carries comment.sty, which the hook/replay fixture uses;
          # the test skips itself when a package is missing, so a lean runner
          # still reports an honest skip instead of a failure.
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            poppler-utils
      - name: execution-replay tests
        run: |
          python tests/test_tex_execution.py
          python tests/test_conditional_acceptance.py
